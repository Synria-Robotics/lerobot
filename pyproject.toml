[tool.poetry]
name = "lerobot"
version = "0.1.0"
description = "🤗 LeRobot: State-of-the-art Machine Learning for Real-World Robotics in Pytorch"
authors = [
    "Rémi Cadène <re.cadene@gmail.com>",
    "Simon Alibert <alibert.sim@gmail.com>",
    "Alexander Soare <alexander.soare159@gmail.com>",
    "Quentin Gallouédec <quentin.gallouedec@ec-lyon.fr>",
    "Adil Zouitine <adilzouitinegm@gmail.com>",
    "Thomas Wolf <thomaswolfcontact@gmail.com>",
    "Steven Palma <imstevenpmwork@ieee.org>",
]
readme = "README.md"
license = "Apache-2.0"
homepage = "https://github.com/huggingface/lerobot"
repository = "https://github.com/huggingface/lerobot"
documentation = "https://huggingface.co/docs/lerobot"
keywords = ["robotics", "deep learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
]

[tool.poetry.dependencies]
python = ">=3.10"
cmake = ">=3.29.0.1"
datasets = ">=2.19.0"
deepdiff = ">=7.0.1"
diffusers = ">=0.27.2"
draccus = ">=0.10.0"
einops = ">=0.8.0"
flask = ">=3.0.3"
gdown = ">=5.1.0"
gymnasium = "==0.29.1" # TODO(rcadene, aliberts): Make gym 1.0.0 work
h5py = ">=3.10.0"
"huggingface-hub" = {version = ">=0.27.1", extras = ["hf-transfer", "cli"]}
"imageio" = {version = ">=2.34.0", extras = ["ffmpeg"]}
jsonlines = ">=4.0.0"
numba = ">=0.59.0"
omegaconf = ">=2.3.0"
"opencv-python-headless" = ">=4.9.0"
packaging = ">=24.2"
av = ">=12.0.5"
pymunk = ">=6.6.0"
pynput = ">=1.7.7"
pyzmq = ">=26.2.1"
"rerun-sdk" = ">=0.21.0"
termcolor = ">=2.4.0"
torch = ">=2.2.1"
torchcodec = {version = ">=0.2.1", markers = "sys_platform != 'win32' and (sys_platform != 'linux' or (platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'armv7l')) and (sys_platform != 'darwin' or platform_machine != 'x86_64')"}
torchvision = ">=0.21.0"
wandb = ">=0.16.3"
zarr = ">=2.17.0"
alicia-d-sdk = { git = "https://github.com/Synria-Robotics/Alicia-D-SDK.git", branch = "v6.0.0" }

[tool.poetry.group.dev.dependencies]
pre-commit = ">=3.7.0"
debugpy = ">=1.8.1"

[tool.poetry.group.test.dependencies]
pytest = ">=8.1.0"
"pytest-cov" = ">=5.0.0"
pyserial = ">=3.5"

# ... (keep the rest of the file like [tool.ruff], [tool.bandit], etc.)

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"